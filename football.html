<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Deep Q-Learning</title>

    <script src="node_modules/highcharts/highcharts.js"></script>
    <script src="external/d3.min.js"></script>

    <style>
        body { font-family: sans-serif; padding: 10px; }
        .stat-label { font-size: 12px; color: #555; margin-right: 6px; }
        .stat-value { font-weight: bold; margin-right: 20px; }
        #stats { margin: 8px 0; }
        #controls { margin: 8px 0; }
        #save-btn, #load-btn { margin-left: 10px; }
        #error-msg { color: red; font-size: 12px; margin-top: 4px; display: none; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // --- Pitch visualisation (D3) ---
            var pitch = d3.select('#pitch');
            var svg = pitch.append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", "0 0 20 40");

            svg.append("rect")
                .attr("x", 0).attr("y", 0)
                .attr("width", 20).attr("height", 40)
                .style("fill", "transparent")
                .attr("stroke", "black")
                .attr("stroke-width", "0.2");

            // Must match Actions.NUM_PLAYERS in the worker.
            var N_PLAYERS = 11;

            var roleColors = [
                "#4444ff", // GK
                "#44aa44", "#44aa44", "#44aa44", // DF
                "#aa4444", "#aa4444", "#aa4444", "#aa4444", // MF
                "#ff8800", "#ff8800", "#ff8800"  // FW
            ];
            var players_svg = new Array(N_PLAYERS).fill(0).map(function(_, i) {
                return svg.append("circle")
                    .attr("r", 0.5)
                    .style("fill", "transparent")
                    .style("stroke-width", ".1")
                    .style("stroke", roleColors[i]);
            });

            // --- Parallel Web Workers ---
            // Use one worker per logical CPU core (minus one for the main thread), capped at 4.
            // Each worker trains an independent DQN agent. Every SYNC_INTERVAL messages the
            // best-performing agent's weights are broadcast to all others (population sync).
            var N_WORKERS = navigator.hardwareConcurrency
                ? Math.min(navigator.hardwareConcurrency - 1, 4)
                : 4;
            N_WORKERS = Math.max(N_WORKERS, 1);

            var SYNC_INTERVAL = 50; // messages across all workers between population syncs
            var SYNC_WINDOW   = 5;  // rolling window size for per-worker reward averaging

            var workers = [];
            var workerRecentReward = []; // rolling average reward per worker
            var workerRewardHistory = []; // raw history for rolling average
            var syncPending = false;
            var totalMsgCount = 0;

            var errorMsg = document.getElementById('error-msg');
            var epsilonSlider = document.getElementById('epsilon-slider');
            var epsilonDisplay = document.getElementById('epsilon');

            document.getElementById('worker-count').textContent = N_WORKERS;

            // --- Reward chart (Highcharts) ---
            var chart = new Highcharts.Chart({
                chart: {
                    renderTo: document.getElementById('container'),
                    animation: false
                },
                title: { text: 'Average Reward per Iteration (worker 0)' },
                xAxis: { title: { text: 'Steps' } },
                yAxis: { title: { text: 'Avg Reward' } },
                plotOptions: {
                    line: {
                        animation: false,
                        marker: { enabled: false },
                        tooltip: { enabled: false }
                    }
                },
                series: [{
                    name: 'Average reward',
                    type: 'line',
                    data: [[0, 0]]
                }]
            });

            for (var i = 0; i < N_WORKERS; i++) {
                workerRecentReward.push(0);
                workerRewardHistory.push([]);
                (function(idx) {
                    var w = new Worker('World.js');

                    w.onerror = function(e) {
                        errorMsg.textContent = 'Worker ' + idx + ' error: ' + e.message;
                        errorMsg.style.display = 'block';
                        console.error('Worker ' + idx + ' error:', e);
                    };

                    w.onmessage = function(ev) {
                        // Population sync response: distribute to all other workers
                        if (ev.data && ev.data.type === 'sync_model') {
                            workers.forEach(function(other, j) {
                                if (j !== idx) other.postMessage(['load', ev.data.data]);
                            });
                            syncPending = false;
                            return;
                        }

                        // User-initiated save response
                        if (ev.data && ev.data.type === 'model') {
                            try {
                                localStorage.setItem('dqn_model', JSON.stringify(ev.data.data));
                                alert('Model saved to local storage.');
                            } catch(e) {
                                alert('Save failed: ' + e.message);
                            }
                            return;
                        }

                        if (!Array.isArray(ev.data) || ev.data.length < 3) return;

                        // Update rolling average reward for this worker.
                        var hist = workerRewardHistory[idx];
                        hist.push(ev.data[1]);
                        if (hist.length > SYNC_WINDOW) hist.shift();
                        workerRecentReward[idx] = hist.reduce(function (a, b) { return a + b; }, 0) / hist.length;

                        // Population sync: find best worker and broadcast its weights
                        totalMsgCount++;
                        if (!syncPending && totalMsgCount % SYNC_INTERVAL === 0) {
                            var bestIdx = 0;
                            for (var k = 1; k < N_WORKERS; k++) {
                                if (workerRecentReward[k] > workerRecentReward[bestIdx]) bestIdx = k;
                            }
                            syncPending = true;
                            workers[bestIdx].postMessage(['sync']);
                        }

                        // UI updates driven by worker 0 only
                        if (idx !== 0) return;

                        chart.series[0].addPoint(ev.data.slice(0, 2), false, false);
                        chart.redraw();

                        var players = ev.data[2];
                        if (players && players.length === N_PLAYERS) {
                            players.forEach(function(p, pidx) {
                                players_svg[pidx].attr("cx", p.x).attr("cy", p.y);
                                players_svg[pidx].style("fill", p.ball === 1 ? "red" : "transparent");
                            });
                        }

                        document.getElementById("step-count").textContent = ev.data[0];
                        if (ev.data[3] !== undefined) {
                            document.getElementById("tderror").textContent = Math.abs(ev.data[3]).toFixed(4);
                        }
                        if (ev.data[4] !== undefined) {
                            var eps = ev.data[4];
                            epsilonDisplay.textContent = eps.toFixed(3);
                            if (Math.abs(parseFloat(epsilonSlider.value) - eps) > 0.001) {
                                epsilonSlider.value = eps;
                            }
                        }
                    };

                    workers.push(w);
                })(i);
            }

            function broadcast(msg) {
                workers.forEach(function(w) { w.postMessage(msg); });
            }

            // --- Start / Stop ---
            var isRunning = false;
            document.getElementById('target').addEventListener('click', function() {
                if (isRunning) {
                    this.textContent = "Start";
                    broadcast(["stop"]);
                } else {
                    this.textContent = "Stop";
                    broadcast(["start"]);
                }
                isRunning = !isRunning;
            });

            // --- Epsilon slider ---
            epsilonSlider.addEventListener('input', function() {
                var val = parseFloat(this.value);
                broadcast(["epsilon", val]);
                epsilonDisplay.textContent = val.toFixed(3);
            });
            epsilonDisplay.textContent = "1.000";

            // --- Speed controls ---
            document.querySelectorAll('#speed input[type="radio"]').forEach(function(radio) {
                radio.addEventListener('change', function() {
                    broadcast(["speed", this.id]);
                });
            });

            // --- Save / Load ---
            // Save: only request from worker 0 to avoid N simultaneous alerts
            document.getElementById('save-btn').addEventListener('click', function() {
                workers[0].postMessage(["save"]);
            });

            document.getElementById('load-btn').addEventListener('click', function() {
                var saved = localStorage.getItem('dqn_model');
                if (!saved) { alert('No saved model found in local storage.'); return; }
                try {
                    broadcast(["load", JSON.parse(saved)]);
                    alert('Model loaded.');
                } catch(e) {
                    alert('Load failed: ' + e.message);
                }
            });
        });
    </script>
</head>
<body>
    <div id="controls">
        <button id="target">Start</button>
        <button id="save-btn">Save Model</button>
        <button id="load-btn">Load Model</button>
    </div>

    <div id="stats">
        <span class="stat-label">Workers:</span><span class="stat-value" id="worker-count">-</span>
        <span class="stat-label">Steps:</span><span class="stat-value" id="step-count">0</span>
        <span class="stat-label">Epsilon:</span><span class="stat-value" id="epsilon">1.000</span>
        <span class="stat-label">TD Error:</span><span class="stat-value" id="tderror">-</span>
    </div>

    <div>
        <label>Epsilon override:</label>
        <input type="range" id="epsilon-slider" min="0" max="1" step="0.05" value="1" style="width:300px;margin-left:8px;">
    </div>

    <div id="error-msg"></div>

    <div>
        <span id="speed">
            <input type="radio" id="slow" name="repeat"><label for="slow">Slow</label>
            <input type="radio" id="normal" name="repeat" checked="checked"><label for="normal">Normal</label>
            <input type="radio" id="fast" name="repeat"><label for="fast">Fast</label>
        </span>
    </div>

    <div style="margin-top:10px;">
        <div id="container" style="display:inline-block;width:800px;height:450px;"></div>
        <div id="pitch"     style="display:inline-block;width:200px;height:400px;"></div>
    </div>
</body>
</html>
